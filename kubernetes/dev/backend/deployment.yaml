apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: 839931788751.dkr.ecr.us-east-2.amazonaws.com/eks-demo-dev-backend:v2

        ports:
        - containerPort: 5000

        readinessProbe:
            httpGet:
              path: /api/health
              port: 5000

            initialDelaySeconds: 5
            periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
      
          initialDelaySeconds: 10
          periodSeconds: 15